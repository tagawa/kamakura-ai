{%- comment -%}
One glyph per tag family, not per tip, so a new tip needs no artwork.
Decorative: the tag label beside it carries the same meaning.
{%- endcomment -%}
<svg class="tip-icon icon-{{ include.group }}" viewBox="0 0 20 20" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
{%- case include.group -%}
{%- when 'ask' -%}<rect x="3" y="4" width="14" height="10" rx="2.5"/><path d="M7 14v3.2l3.6-3.2"/>
{%- when 'method' -%}<path d="M3.2 6h2.2M9 6h7.8M3.2 10h2.2M9 10h7.8M3.2 14h2.2M9 14h7.8"/>
{%- when 'check' -%}<circle cx="8.8" cy="8.8" r="5"/><path d="M12.6 12.6 17 17"/>
{%- else -%}<path d="M10 17.2s5.4-5.4 5.4-9.2a5.4 5.4 0 1 0-10.8 0c0 3.8 5.4 9.2 5.4 9.2z"/><circle cx="10" cy="8" r="1.9"/>
{%- endcase -%}
</svg>
